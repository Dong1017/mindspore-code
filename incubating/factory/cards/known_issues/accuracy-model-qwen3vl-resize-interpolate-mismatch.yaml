  problem_type: accuracy
  stage: train
  domain: mindspore
  hardware: ascend
  severity: high
  occurrence_count: 1
  environment:
    frameworks:
    - name: mindspore
      version: master
      commit: 4b99047cefc86fa0af9b5c0be7f0b8c4aee9b644
    - name: torch
