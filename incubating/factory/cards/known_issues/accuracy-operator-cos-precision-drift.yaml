  occurrence_count: 1
  environment:
    frameworks:
    - name: mindspore
      version: master
      commit: 0b12b4a1
    runtime:
      cann_version: none
    model:
      execution_mode: GRAPH_MODE
      testcase_family:
      - test_p_cos_input_2d_complex64
      - test_p_cos_input_4d_complex64
      - test_p_cos_input_5d_complex128
